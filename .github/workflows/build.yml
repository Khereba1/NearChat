name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore NekoBox libcore.aar from Cache
        id: libcore-cache
        uses: actions/cache@v4
        with:
          path: app/libs-full/libcore.aar
          key: nekobox-libcore-v1-${{ hashFiles('libcore/**', 'buildScript/**') }}

      - name: Try downloading prebuilt libcore.aar from Releases if Cache missed
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p app/libs-full
          gh release download prebuilt-libs -p "libcore.aar" -D app/libs-full --clobber || true

      - name: Set up Android NDK & Go (Only if libcore.aar is missing)
        if: hashFiles('app/libs-full/libcore.aar') == ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Build NekoBox libcore.aar (Only if missing)
        if: hashFiles('app/libs-full/libcore.aar') == ''
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.0.8775105" >/dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.0.8775105"
          chmod -R +x run buildScript libcore/*.sh
          ./run lib core
          ls -lh app/libs-full/libcore.aar

      - name: Save libcore.aar permanently to prebuilt-libs Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f app/libs-full/libcore.aar ]; then
            if ! gh release view prebuilt-libs >/dev/null 2>&1; then
              gh release create prebuilt-libs app/libs-full/libcore.aar --title "Prebuilt libcore.aar (Do Not Delete)" --notes "Permanent prebuilt NekoBox libcore.aar for fast CI builds"
            fi
          fi

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O "$RUNNER_TEMP/gradle.zip"
          sudo unzip -q "$RUNNER_TEMP/gradle.zip" -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Download native tunnel AARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download 2.20.0 -R heiher/hev-socks5-tunnel -p "*.aar" -D app/libs
          rm -f app/libs/libv2ray.aar
          ls -la app/libs app/libs-full

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the stable signing key."
          else
            echo "No signing key secrets found: using a temporary debug signature."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NAME="${GH_REPO##*/}"
          cp app/build/outputs/apk/release/*.apk "$NAME.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$NAME.apk" --title "$NAME - latest build" --notes "Automatic build of commit ${{ github.sha }}" --target "${{ github.sha }}"
