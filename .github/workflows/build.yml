name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;25.0.8775105'

      - name: Cache NekoBox libcore.aar
        id: libcore-cache
        uses: actions/cache@v4
        with:
          path: app/libs-full/libcore.aar
          key: nekobox-libcore-v1-${{ hashFiles('libcore/**', 'buildScript/**') }}

      - name: Set up Go for libcore build
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Build NekoBox libcore.aar
        if: steps.libcore-cache.outputs.cache-hit != 'true'
        run: |
          chmod -R +x run buildScript libcore/*.sh
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.0.8775105"
          ./run lib core
          ls -lh app/libs-full/libcore.aar

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O "$RUNNER_TEMP/gradle.zip"
          sudo unzip -q "$RUNNER_TEMP/gradle.zip" -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Download native tunnel AARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download 2.20.0 -R heiher/hev-socks5-tunnel -p "*.aar" -D app/libs
          rm -f app/libs/libv2ray.aar
          ls -la app/libs app/libs-full

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the stable signing key."
          else
            echo "No signing key secrets found: using a temporary debug signature."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleFullRelease assembleLiteRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Publish to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NAME="${GH_REPO##*/}"
          cp app/build/outputs/apk/full/release/*.apk "$NAME.apk"
          cp app/build/outputs/apk/lite/release/*.apk "$NAME-Lite.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$NAME.apk" "$NAME-Lite.apk" --title "$NAME - latest build (Full & Lite)" --notes "Automatic build of commit ${{ github.sha }}" --target "${{ github.sha }}"
